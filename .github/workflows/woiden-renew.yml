name: ♻️ Woiden Auto Renew

on:
  schedule:
    - cron: '32 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # 前置粗筛：用 woiden-time.txt（上次执行时间，UTC）判断距上次执行是否已达阈值（默认 2 天）。
  # 未达阈值 → 直接跳过整套依赖安装/登录/续期流程，大幅缩短无谓构建时长；
  # 达到阈值、文件缺失或解析失败 → 走下方完整流程（原逻辑保留）。
  check-time:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      needed_indexes: ${{ steps.decide.outputs.needed_indexes }}
      skipped: ${{ steps.decide.outputs.skipped }}
    env:
      BATCH: ${{ secrets.BATCH }}
      TIME_FILE: woiden-time.txt
      SKIP_DAYS: "2"   # woiden 阈值，对应脚本 WOIDEN_MIN_VALID_DAYS，日后可在此调整
    steps:
      - uses: actions/checkout@v7

      - name: 按账户判断是否跳过本轮
        id: decide
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone, timedelta

          skip_days = int(os.environ.get("SKIP_DAYS", "2"))
          time_file = os.environ.get("TIME_FILE", "woiden-time.txt")
          batch_val = os.environ.get("BATCH", "").strip().replace("\\n", ";")
          accounts = [x.strip() for x in batch_val.split(";") if x.strip()]
          key_of = lambda p: hashlib.md5(p.strip().encode()).hexdigest()[:8]

          # 时间文件每行：账户hash,到期日(YYYY-MM-DD) 或 NOVPS（无机器/失败状态）。
          records = {}
          try:
              with open(time_file, encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if "," in line:
                          k, t = line.split(",", 1)
                          records[k] = t
          except FileNotFoundError:
              print(f"{time_file} 不存在，全部账户视为需要运行")
          except Exception as e:
              print(f"时间文件解析失败（{e}），全部账户视为需要运行")

          today = datetime.now(timezone(timedelta(hours=8))).date()  # 北京时间日期，只算日期
          needed_indexes = []
          skipped_meta = []
          for index, account in enumerate(accounts, 1):
              phone = account.split(",", 1)[0].strip()
              key = key_of(phone)
              last = records.get(key)
              run = True
              days_left = None
              if last is None:
                  print(f"账户 {key} 无记录，视为需要运行")
              else:
                  val = last.strip()
                  if val.upper() == "NOVPS":
                      print(f"账户 {key} 状态 NOVPS（无机器），需要运行以更新到期日")
                  else:
                      try:
                          valid = datetime.strptime(val, "%Y-%m-%d").date()
                          days_left = (valid - today).days   # 整数天，不足一天算 0
                          print(f"账户 {key} 剩余 {days_left} 天（到期 {val}，阈值 {skip_days} 天）")
                          run = days_left < skip_days
                      except Exception as e:
                          print(f"账户 {key} 日期解析失败（{e}），视为需要运行")
              print(f"  -> {'✅运行' if run else '⏭️跳过'}")
              if run:
                  needed_indexes.append(index)
              else:
                  skipped_meta.append({"index": index, "days": days_left})

          print(f"需要运行的账户：{len(needed_indexes)}/{len(accounts)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if needed_indexes else 'false'}\n")
              f.write(f"needed_indexes={json.dumps(needed_indexes)}\n")
              f.write(f"skipped={json.dumps(skipped_meta)}\n")
          PY

      - name: 通知跳过的账户
        env:
          BATCH: ${{ secrets.BATCH }}
          SKIPPED: ${{ steps.decide.outputs.skipped }}
          SKIP_DAYS: "2"
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta

          skipped = json.loads(os.environ.get("SKIPPED", "[]"))
          skip_days = int(os.environ.get("SKIP_DAYS", "2"))
          if not skipped:
              print("没有跳过的账户，无需通知")
              exit(0)
          accounts = [x.strip() for x in os.environ.get("BATCH", "").replace("\\n", ";").split(";") if x.strip()]

          now_bj = datetime.now(timezone.utc) + timedelta(hours=8)
          now_utc = datetime.now(timezone.utc)
          for item in skipped:
              idx = item.get("index", 0)
              if not (0 < idx <= len(accounts)):
                  print(f"序号 {idx} 超出范围，跳过通知")
                  continue
              account = accounts[idx - 1]
              days = item.get("days")
              fields = [x.strip() for x in account.split(",")]
              if len(fields) < 3 or not fields[1] or not fields[2]:
                  print("账户字段不足，跳过通知")
                  continue
              token, chat = fields[1], fields[2]
              tail = fields[0][-3:] if fields[0] else "000"
              days_txt = f"{days:.2f}" if days is not None else "?"
              text = (
                  f"🎮 <b>woiden.id</b> 续期报告\n"
                  f"🕐 运行时间: {now_bj.strftime('%Y-%m-%d %H:%M:%S')} (北京时间)\n"
                  f"🕐 运行时间: {now_utc.strftime('%Y-%m-%d %H:%M:%S')} (UTC)\n"
                  f"👤 账号: ***{tail}\n"
                  f"⏭️ 剩余 {days_txt} 天（阈值 {skip_days} 天），无需续期\n"
              )
              data = urllib.parse.urlencode({"chat_id": chat, "text": text, "parse_mode": "HTML"}).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data,
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )
              urllib.request.urlopen(req, timeout=15)
              print(f"已通知跳过账户: ***{tail}")
          PY

  # 先解析 BATCH，自动检测账号数量并生成 matrix（与 hax 对齐）：
  #   1 个账号 → 1 个 job；2 个账号 → 2 个独立 job，并发互不干扰。
  # 账号信息只以掩码形式出现在日志，完整凭据仅通过 job 间内部输出传递。
  build-matrix:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      display: ${{ steps.gen.outputs.display }}
    steps:
      - name: 按需要运行的序号生成账号矩阵
        id: gen
        env:
          BATCH: ${{ secrets.BATCH }}
          NEEDED: ${{ needs.check-time.outputs.needed_indexes }}
        run: |
          python3 - <<'PY'
          import json, os
          needed_indexes = json.loads(os.environ.get("NEEDED", "[]"))
          if not needed_indexes:
              raise SystemExit("无需要运行的账户")
          accounts = [x.strip() for x in os.environ.get("BATCH", "").replace("\\n", ";").split(";") if x.strip()]
          def mask_phone(phone):
              # job 名/日志只显示手机号末 3 位：+86-13xxxxxxxx880 → ***880
              p = phone.strip()
              return f"***{p[-3:]}"

          # 矩阵只放脱敏字段（原始账号序号 + 掩码手机号），
          # 完整账号行不进入矩阵上下文，避免明文出现在 job 名/env 展示中
          display = []
          for index in needed_indexes:
              if not (0 < index <= len(accounts)):
                  raise SystemExit(f"序号 {index} 超出范围 1..{len(accounts)}")
              account = accounts[index - 1]
              fields = [x.strip() for x in account.split(",")]
              if len(fields) < 6 or any(not fields[i] for i in range(6)):
                  raise SystemExit(f"NEEDED 第 {index} 个账号字段不足或存在空字段")
              display.append({"index": index, "mask": mask_phone(fields[0])})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"display={json.dumps(display)}\n")
          print(f"需要运行的账号：{len(display)} 个，拆分为 {len(display)} 个独立 job 并发执行")
          for m in display:
              print(f"  - 账号 #{m['index']}: {m['mask']}")
          PY

  renew:
    name: "Woiden 续期"
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # 每个账号独立一组，矩阵 job 并行执行（同账号的重复运行仍防重叠）
      group: Woiden_Renew_${{ matrix.account.index }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.build-matrix.outputs.display) }}
    env:
      # 每个 job 只处理一个账号：完整账号从内部输出按序号索引取用，
      # 完整账号只引用 secrets.BATCH（GitHub 日志自动掩码为 ***），
      # 通过数字序号 BATCH_ACCOUNT_INDEX 指定本 job 处理哪个账号
      BATCH: ${{ secrets.BATCH }}
      BATCH_ACCOUNT_INDEX: ${{ matrix.account.index }}
      ACCOUNT_MASK: ${{ matrix.account.mask }}
      # 代理（与 hax 复用同一个）
      PROXY_CONTENT: ${{ secrets.PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}
      # 可选
      SCREENSHOT_DIR: screenshots
      DEBUG_FLAG: "1"
      # 续期重试次数（外层）：reCAPTCHA v3 分数被拒时（Robot verification failed）
      # 会用 WARP 换 IP 重新提交整个表单，直到分数达标或重试耗尽
      MAX_RENEW_RETRIES: "5"
      # IP 被封时切换 WARP 重试次数（内层）
      MAX_WARP_RETRIES: "10"
      # 登录重试次数
      MAX_LOGIN_RETRIES: "1"
      # 2captcha 打码服务 API Key（可选，用于 WARP 数据中心 IP 过不了 reCAPTCHA invisible 时）
      # 在仓库 → Settings → Secrets and variables → Actions 中添加 TWOCAPTCHA_API_KEY
      TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
      # 脚本（woiden-renew.py）与工作流同仓库，已由 checkout 检出到根目录，
      # 无需再检出私有仓库。

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 创建输出目录
        run: mkdir -p ${{ env.SCREENSHOT_DIR }}

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 缓存 Chromium apt 包
        uses: actions/cache@v6
        with:
          path: ~/.cache/woiden-apt/*.deb
          key: apt-chromium-${{ runner.os }}-${{ runner.arch }}-v1

      - name: 安装依赖
        run: |
          mkdir -p "$HOME/.cache/woiden-apt/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/woiden-apt" \
            install -y xvfb chromium ffmpeg unzip curl wget jq ca-certificates
          pip install --upgrade pip
          pip install -r requirements.txt -q
          python3 -c 'import speech_recognition, pydub, audioop; print("语音依赖导入成功")'

      - name: 启用 WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: ipv4
          mode: client

      - name: 安装代理
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 执行续期
        run: |
          set -o pipefail
          echo "[INFO] 开始续期: 账号 #${{ matrix.account.index }} (${{ env.ACCOUNT_MASK }})"
          python3 -u woiden-renew.py 2>&1 | tee woiden-renew.log &
          renew_pid=$!
          while kill -0 "$renew_pid" 2>/dev/null; do
            echo "[HEARTBEAT] 执行续期仍在运行: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            sleep 15
          done
          wait "$renew_pid"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: woiden-screenshots-${{ matrix.account.index }}-${{ github.run_id }}
          path: ${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: woiden-renew-log-${{ matrix.account.index }}-${{ github.run_id }}
          path: woiden-renew.log
          retention-days: 7
          if-no-files-found: warn

      - name: 清理本地截图
        if: always()
        run: |
          SCREENSHOT_PATH="${{ env.SCREENSHOT_DIR }}"
          if [ -d "$SCREENSHOT_PATH" ]; then
            rm -rf "$SCREENSHOT_PATH"/*
            echo "本地截图已清理"
          fi

      - name: 提交执行时间（按账户）
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 每账户一行：账户hash,到期日 或 NOVPS。多账户 job 并发时，
          # 每次基于最新 origin/main 更新自己的行再推送，冲突自动重试，互不覆盖。
          # 账号行只在 secrets.BATCH 内解析（日志自动掩码），不把分片账号写入 env
          PHONE="$(python3 - <<'PY'
          import os
          accounts = [x.strip() for x in os.environ.get("BATCH", "").replace("\\n", ";").split(";") if x.strip()]
          idx = int(os.environ.get("BATCH_ACCOUNT_INDEX", "0") or 0)
          if 0 < idx <= len(accounts):
              print(accounts[idx - 1].split(",", 1)[0].strip())
          PY
          )"
          if [ -z "$PHONE" ]; then
            echo "无法按序号定位账户，跳过时间更新"
            exit 0
          fi
          KEY="$(python3 -c "import hashlib,sys;print(hashlib.md5(sys.argv[1].encode()).hexdigest()[:8])" "$PHONE")"
          # 到期日/状态来自脚本写入的 woiden-time-value.txt（Valid until 只算日期）
          VALUE=""
          if [ -f woiden-time-value.txt ]; then
            VALUE="$(grep "^$KEY," woiden-time-value.txt | head -1 | cut -d',' -f2)"
          fi
          if [ -z "$VALUE" ]; then
            echo "未获取到账户 $KEY 的到期日/状态，跳过时间更新（保持原值）"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "提交执行时间（账户 $KEY），第 ${attempt}/3 次尝试"
            git fetch origin refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            python3 - "$KEY" "$VALUE" <<'PY'
          import sys
          key, now = sys.argv[1], sys.argv[2]
          fn = "woiden-time.txt"
          rows = {}
          try:
              with open(fn, encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if "," in line:
                          k, t = line.split(",", 1)
                          rows[k] = t
          except FileNotFoundError:
              pass
          rows[key] = now
          with open(fn, "w", encoding="utf-8") as f:
              for k in sorted(rows):
                  f.write(f"{k},{rows[k]}\n")
          PY
            git add woiden-time.txt
            if git diff --cached --quiet -- woiden-time.txt; then
              echo "时间文件该行已是最新（由并发任务更新），无需提交"
              exit 0
            fi
            git commit -m "更新 Woiden 时间文件(按账户): $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            if git push origin HEAD:refs/heads/main; then
              echo "执行时间已提交"
              exit 0
            fi
            echo "推送发生并发冲突，重新获取远端后重试"
            # 未更新成功时恢复工作树，保证时间文件该行保持原值（下次仍会触发运行）
            git reset --hard origin/main
            sleep 2
          done
          echo "3 次推送均失败，时间未更新，下次仍会运行该账户"
          exit 1

      - name: 🧹 清理旧的工作流运行记录
        if: always() && matrix.account.index == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          current_run="${{ github.run_id }}"
          cutoff_epoch=$(date -d '24 hours ago' +%s)
          runs=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow="woiden-renew.yml" \
            --limit=100 \
            --json databaseId,createdAt,status,conclusion \
            --jq '.[] | [.databaseId, .createdAt, .status, (.conclusion // "")] | @tsv' 2>/dev/null)
          if [ -z "$runs" ]; then
            echo "没有找到可清理的运行记录"
            exit 0
          fi
          while IFS=$'\t' read -r run_id created_at status conclusion; do
            [ -z "$run_id" ] && continue
            if [ "$run_id" = "$current_run" ]; then
              echo "保留当前运行记录: $run_id"
              continue
            fi
            created_epoch=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
            if [ "$created_epoch" -ge "$cutoff_epoch" ]; then
              echo "保留 24 小时内记录: $run_id ($created_at)"
              continue
            fi
            if [ "$status" != "completed" ]; then
              echo "保留未完成记录: $run_id (status=$status)"
              continue
            fi
            echo "删除超过 24 小时的已完成记录: $run_id (created=$created_at, conclusion=$conclusion)"
            gh run delete "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done <<< "$runs"
          echo "清理完成：保留最近 24 小时记录及所有未完成记录"
