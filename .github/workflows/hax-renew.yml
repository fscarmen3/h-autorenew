name: 🔄 Hax Auto Renew

on:
  schedule:
    - cron: '8 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # 先解析 BATCH，自动检测账号数量并生成 matrix：
  #   1 个账号 → 1 个 job；2 个账号 → 2 个独立 job，互不干扰。
  # 每个账号在独立容器中单独登录/续期，彻底避免同一浏览器
  # 连续跑多个账号时的状态残留（第二个账号 Telegram iframe 断连）。
  # 账号信息只以掩码形式出现在日志，完整凭据仅通过 job 间内部输出传递。
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.gen.outputs.accounts }}
      display: ${{ steps.gen.outputs.display }}
    steps:
      - name: 检测 BATCH 并生成账号矩阵
        id: gen
        env:
          BATCH: ${{ secrets.BATCH }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          value = os.environ.get("BATCH", "").strip().replace("\\n", ";")
          accounts = [x.strip() for x in value.split(";") if x.strip()]
          if not accounts:
              raise SystemExit("BATCH 未设置或为空")
          def mask_phone(phone):
              # job 名/日志只显示手机号末 3 位：+86-13xxxxxxxx880 → ***880
              p = phone.strip()
              return f"***{p[-3:]}"

          # accounts[0] 为占位元素，使 1-based 序号可直接作为数组下标
          # （GitHub 表达式不支持算术，无法用 [index - 1] 定位）
          matrix = [{"index": 0}]
          display = []
          for index, account in enumerate(accounts, 1):
              fields = [x.strip() for x in account.split(",")]
              if len(fields) < 6 or any(not fields[i] for i in range(6)):
                  raise SystemExit(f"BATCH 第 {index} 个账号字段不足或存在空字段")
              matrix.append({"index": index, "batch": account,
                             "mask": mask_phone(fields[0])})
              # 矩阵只暴露脱敏字段（序号 + 掩码手机号），完整账号不进入矩阵上下文；
              # 用掩码而非 chat_id，避免多个账号共享同一 TG 接收人时 job 名无法区分
              display.append({"index": index, "mask": mask_phone(fields[0])})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"accounts={json.dumps(matrix)}\n")
              f.write(f"display={json.dumps(display)}\n")
          print(f"BATCH 预检通过：{len(accounts)} 个账号，将拆分为 {len(accounts)} 个独立 job 并发执行")
          for m in matrix[1:]:
              print(f"  - 账号 #{m['index']}: {m['mask']}")
          PY

  renew:
    # 矩阵只含脱敏字段（序号 + TG chat_id），GitHub 自动附加到 job 名时
    # 不会出现手机号/令牌/session 等敏感信息
    name: "Hax 续期"
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # 每个账号独立一组，矩阵 job 并行执行（同账号的重复运行仍防重叠）
      group: Hax_Renew_${{ matrix.account.index }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.build-matrix.outputs.display) }}
    env:
      # 每个 job 只处理一个账号：完整账号从内部输出按序号索引取用，
      # 不经过矩阵上下文，避免出现在 job 名称/矩阵 UI 中
      BATCH: ${{ fromJSON(needs.build-matrix.outputs.accounts)[matrix.account.index].batch }}
      ACCOUNT_MASK: ${{ fromJSON(needs.build-matrix.outputs.accounts)[matrix.account.index].mask }}
      # 代理
      PROXY_CONTENT: ${{ secrets.PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}
      # 可选
      SCREENSHOT_DIR: screenshots
      DEBUG_FLAG: "1"
      # 续期重试次数（外层）
      MAX_RENEW_RETRIES: "5"
      # IP 被封时切换 WARP 重试次数（内层）
      MAX_WARP_RETRIES: "10"
      # 登录重试次数
      MAX_LOGIN_RETRIES: "1"
      # 脚本（hax-renew.py）与工作流同仓库，已由 checkout 检出到根目录，
      # 无需再检出私有仓库。

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 创建输出目录
        run: mkdir -p ${{ env.SCREENSHOT_DIR }}

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 缓存 Chromium apt 包
        uses: actions/cache@v6
        with:
          path: ~/.cache/hax-apt/*.deb
          key: apt-chromium-${{ runner.os }}-${{ runner.arch }}-v1

      - name: 安装依赖
        run: |
          mkdir -p "$HOME/.cache/hax-apt/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/hax-apt" \
            install -y xvfb chromium ffmpeg unzip curl wget jq ca-certificates
          pip install --upgrade pip
          pip install -r requirements.txt -q
          python3 -c 'import speech_recognition, pydub, audioop; print("语音依赖导入成功")'

      - name: 启用 WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: ipv4
          mode: client

      - name: 安装代理
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 执行续期
        run: |
          set -o pipefail
          echo "[INFO] 开始续期: 账号 #${{ matrix.account.index }} (${{ env.ACCOUNT_MASK }})"
          python3 -u hax-renew.py 2>&1 | tee hax-renew.log &
          renew_pid=$!
          while kill -0 "$renew_pid" 2>/dev/null; do
            echo "[HEARTBEAT] 执行续期仍在运行: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            sleep 15
          done
          wait "$renew_pid"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hax-screenshots-${{ matrix.account.index }}-${{ github.run_id }}
          path: ${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hax-renew-log-${{ matrix.account.index }}-${{ github.run_id }}
          path: hax-renew.log
          retention-days: 7
          if-no-files-found: warn

      - name: 清理本地截图
        if: always()
        run: |
          SCREENSHOT_PATH="${{ env.SCREENSHOT_DIR }}"
          if [ -d "$SCREENSHOT_PATH" ]; then
            rm -rf "$SCREENSHOT_PATH"/*
            echo "本地截图已清理"
          fi

      - name: 提交执行时间
        if: always() && matrix.account.index == 1
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # hax-time.txt 可能被并发的 schedule/手动 run 同时更新。
          # 每次以最新 origin/main 为基准重建提交，避免 pull --rebase 产生内容冲突。
          for attempt in 1 2 3; do
            echo "提交执行时间，第 ${attempt}/3 次尝试"
            git fetch origin refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            date +'%Y-%m-%d %H:%M:%S' > hax-time.txt
            git add hax-time.txt
            git commit -m "更新 Hax 时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            if git push origin HEAD:refs/heads/main; then
              echo "执行时间已提交"
              exit 0
            fi
            echo "推送发生并发冲突，重新获取远端后重试"
            git reset --hard origin/main
            sleep 2
          done
          echo "3 次推送均失败"
          exit 1

      - name: 🧹 清理旧的工作流运行记录
        if: always() && matrix.account.index == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          current_run="${{ github.run_id }}"
          cutoff_epoch=$(date -d '24 hours ago' +%s)
          runs=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow="hax-renew.yml" \
            --limit=100 \
            --json databaseId,createdAt,status,conclusion \
            --jq '.[] | [.databaseId, .createdAt, .status, (.conclusion // "")] | @tsv' 2>/dev/null)
          if [ -z "$runs" ]; then
            echo "没有找到可清理的运行记录"
            exit 0
          fi
          while IFS=$'\t' read -r run_id created_at status conclusion; do
            [ -z "$run_id" ] && continue
            if [ "$run_id" = "$current_run" ]; then
              echo "保留当前运行记录: $run_id"
              continue
            fi
            created_epoch=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
            if [ "$created_epoch" -ge "$cutoff_epoch" ]; then
              echo "保留 24 小时内记录: $run_id ($created_at)"
              continue
            fi
            if [ "$status" != "completed" ]; then
              echo "保留未完成记录: $run_id (status=$status)"
              continue
            fi
            echo "删除超过 24 小时的已完成记录: $run_id (created=$created_at, conclusion=$conclusion)"
            gh run delete "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done <<< "$runs"
          echo "清理完成：保留最近 24 小时记录及所有未完成记录"
